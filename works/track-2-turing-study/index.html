<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambridge Study 1936 — Universal Tape Machine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231b1611'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23cfa459' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23cfa459'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewport-root" aria-label="1936 King's College Cambridge Room X.8 3D Study">
    <canvas id="study-canvas"></canvas>
  </div>

  <div id="hud-layer">
    <!-- Top-Left Museum Exhibition Placard -->
    <header class="placard-card" data-hud-card="placard">
      <div class="placard-kicker">KING&rsquo;S COLLEGE CAMBRIDGE &middot; ROOM X.8 &middot; 1936</div>
      <h1 class="placard-title">Cambridge Study 1936</h1>
      <div class="placard-sub">Universal Tape Machine &amp; Entscheidungsproblem Desk</div>
      <div class="placard-telemetry" aria-live="polite">
        <span class="tel-item"><span class="tel-key">STEP</span> <strong id="tel-steps">000</strong></span>
        <span class="tel-sep" aria-hidden="true">&middot;</span>
        <span class="tel-item"><span class="tel-key">m-CFG</span> <strong id="tel-state">q0</strong></span>
        <span class="tel-sep" aria-hidden="true">&middot;</span>
        <span class="tel-item"><span class="tel-key">FPS</span> <strong id="tel-fps">60</strong></span>
      </div>
    </header>

    <!-- Top-Right Camera Presets & Studio Bar -->
    <nav class="camera-bar" data-hud-card="camera-bar" aria-label="Camera views and studio controls">
      <div class="view-group" role="group" aria-label="Camera presets">
        <button type="button" class="bar-btn is-active" id="btn-view-hero" data-view="hero" title="3/4 Study &amp; Desk Overview">Study</button>
        <button type="button" class="bar-btn" id="btn-view-macro" data-view="macro" title="Close-up on Brass Universal Tape Machine">Macro</button>
        <button type="button" class="bar-btn" id="btn-view-alt" data-view="alt_mode" title="Gothic Chapel Window, Blackboard &amp; Desk">Chapel</button>
      </div>
      <div class="bar-divider" aria-hidden="true"></div>
      <button type="button" class="bar-btn icon-btn" id="btn-sound" aria-pressed="false" title="Toggle Mechanical Solenoid Audio">
        <svg class="icon-svg" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M2.5 6.8h3.1l3.9-3.3v11l-3.9-3.3H2.5z" fill="currentColor"/>
          <path id="sound-wave-1" d="M12 6.4a3.5 3.5 0 0 1 0 5.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path id="sound-wave-2" d="M14.1 4.4a6.2 6.2 0 0 1 0 9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line id="sound-mute-x" x1="11.6" y1="6.3" x2="16.2" y2="11.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="btn-label" id="sound-label">Muted</span>
      </button>
      <button type="button" class="bar-btn" id="btn-drawer-toggle" aria-expanded="true" aria-controls="utm-drawer" title="Toggle Apparatus Controls">
        Controls
      </button>
    </nav>

    <!-- Collapsible Right-Side UTM Apparatus Controller -->
    <aside class="utm-drawer" id="utm-drawer" data-hud-card="utm-drawer" aria-label="Universal Tape Machine controller">
      <div class="drawer-header">
        <span class="drawer-heading">Apparatus Console</span>
        <span class="status-badge is-idle" id="utm-status-badge">STANDBY</span>
      </div>

      <div class="control-block">
        <label class="field-label" for="program-select">COMPUTATION TABLE</label>
        <select id="program-select" class="brass-select" aria-label="Select Turing Machine program"></select>
        <p class="program-desc" id="program-desc"></p>
      </div>

      <div class="control-block">
        <div class="transport-row">
          <button type="button" class="ctrl-btn ctrl-primary" id="btn-play">Play</button>
          <button type="button" class="ctrl-btn" id="btn-step">Step</button>
          <button type="button" class="ctrl-btn" id="btn-reset">Reset</button>
        </div>
      </div>

      <div class="control-block">
        <div class="slider-row">
          <label class="field-label" for="speed-slider">CADENCE</label>
          <span class="mono-val" id="speed-readout">3.0 steps/s</span>
        </div>
        <input id="speed-slider" class="brass-range" type="range" min="1" max="12" step="0.5" value="3" />
      </div>

      <div class="rule-panel">
        <div class="rule-header">
          <span class="field-label">TRANSITION &delta;(q, s)</span>
          <span class="mono-val" id="head-pos-readout">HEAD 0</span>
        </div>
        <div class="rule-readout" id="rule-readout">Ready &mdash; awaiting impulse</div>
      </div>
    </aside>

    <!-- Bottom Perforated Paper Tape Strip -->
    <section class="tape-dock" data-hud-card="tape-dock" aria-label="Live paper tape register">
      <div class="tape-meta-row">
        <span class="tape-tag">PAPER TAPE REGISTER</span>
        <span class="tape-rule-inline" id="tape-rule-inline">m-config: q0 &middot; Ready</span>
      </div>
      <div class="tape-strip-frame">
        <div class="tape-cells" id="tape-cells" role="list" aria-label="Active tape window"></div>
      </div>
    </section>
  </div>

  <script type="module" src="./study-scene.js"></script>
</body>
</html>
